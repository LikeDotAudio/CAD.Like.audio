name: Publish to cad.like.audio

# Builds the Vite app and uploads dist/ to the web host over FTPS.
#
# Required repository secret:
#   FTP_PASSWORD  — password for the cad@like.audio FTP account
# Optional repository variables (defaults shown in `env` below):
#   FTP_SERVER, FTP_USERNAME, FTP_SERVER_DIR

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ftps-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ vars.FTP_SERVER || 'cad.like.audio' }}
          username: ${{ vars.FTP_USERNAME || 'cad@like.audio' }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
          # Keep the action's own state file out of the way and never delete
          # files the build does not own.
          state-name: .ftp-deploy-sync-state.json
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
